[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwen-assistant"
version = "0.1.0"
description = "Private Telegram assistant with memory and voice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.49,<1",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7,<3",
  "python-telegram-bot>=21.10,<23",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gwen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

